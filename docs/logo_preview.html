<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityMart Logo - Versión Amazónica</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #111; /* Fondo oscuro para resaltar el verde y blanco */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            color: white;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
        }
        .logo-text {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 0.9;
        }
        .logo-text .city { color: white; }
        .logo-text .mart { color: #22c55e; } /* Verde Selva */
        
        .slogan {
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 5px;
            opacity: 0.8;
            color: white;
        }
    </style>
</head>
<body>
    <h1 style="margin-bottom: 30px;">Identidad Actual + Colores Amazónicos</h1>
    <p style="margin-bottom: 50px; opacity: 0.7;">Manteniendo el icono original con Verde y Blanco</p>

    <div class="logo-container">
        <!-- Recreación fiel del icono original en SVG con nuevos colores -->
        <svg width="150" height="150" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Smartphone Frame (Antes Azul, Ahora Verde Profundo o Blanco) -->
            <rect x="20" y="10" width="50" height="80" rx="6" fill="none" stroke="white" stroke-width="3"/>
            <rect x="35" y="12" width="20" height="3" rx="1.5" fill="white"/>
            
            <!-- Bloques Internos (Antes Rojo, Azul, Amarillo - Ahora Variaciones de Verde) -->
            <rect x="25" y="20" width="40" height="20" rx="3" fill="#22c55e"/> <!-- Bloque Principal Verde -->
            <rect x="25" y="45" width="18" height="18" rx="3" fill="#16a34a"/> <!-- Bloque Secundario -->
            <rect x="47" y="45" width="18" height="18" rx="3" fill="#4ade80"/> <!-- Bloque Acento -->
            <rect x="25" y="68" width="18" height="15" rx="3" fill="white" fill-opacity="0.3"/>
            <rect x="47" y="68" width="18" height="15" rx="3" fill="white" fill-opacity="0.3"/>

            <!-- Carrito de Compras (Antes Azul, Ahora Verde Brillante) -->
            <path d="M45 55 H85 L90 80 H55 L50 60 L45 55" fill="#22c55e" stroke="white" stroke-width="1"/>
            <circle cx="65" cy="88" r="4" fill="white"/>
            <circle cx="82" cy="88" r="4" fill="white"/>
            <path d="M50 60 Q50 90 65 90 H82" fill="none" stroke="white" stroke-width="2"/>
        </svg>

        <div class="logo-text">
            <div class="city">City</div>
            <div class="mart">Mart</div>
            <div class="slogan">TODO EN TUS MANOS</div>
        </div>
    </div>
    
    <p style="margin-top: 50px; color: #aaa;">* Al ser un vector (SVG), se adapta a cualquier tamaño sin pixelarse y es transparente.</p>
</body>
</html>
