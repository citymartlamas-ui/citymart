<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Iniciar Sesión | CityMart</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/utils.js"></script>
    <style>
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-soft);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-soft);
            width: 18px;
            transition: var(--transition);
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 48px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        input:focus + i {
            color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.2);
            letter-spacing: 0.02em;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .social-login {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(0,0,0,0.05);
            position: relative;
        }

        .social-btn {
            width: 100%;
            padding: 14px;
            background: white;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .social-btn:hover {
            background: #f8fafc;
            border-color: rgba(0,0,0,0.15);
        }

        .footer-links {
            margin-top: 32px;
            font-size: 0.95rem;
            color: var(--text-soft);
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-v4.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <header class="section" style="padding-top: 20px;">
        <div class="container" style="display: flex; justify-content: center;">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="CityMart" style="height: 60px; width: auto;">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="login-container">
            <div class="login-card">
                <h2 style="font-family: 'Inter'; font-size: 1.8rem; margin-bottom: 8px; color: var(--text-main); font-weight: 700;">¡Bienvenido de nuevo!</h2>
                <p style="color: var(--text-soft); margin-bottom: 32px; font-size: 0.95rem; font-weight: 500;">Ingresa a tu cuenta para continuar</p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                        <div style="text-align: right; margin-top: 8px;">
                            <a href="forgot-password.html"
                                style="font-size: 0.8rem; color: var(--primary-color); text-decoration: none; font-weight: 600;">¿Olvidaste
                                tu contraseña?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
                </form>

                <div class="social-login">
                    <p
                        style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 16px; background: white; display: inline-block; padding: 0 10px; position: relative; top: -10px; z-index: 1;">
                        O continúa con</p>
                    <button class="social-btn">
                        <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 18px;">
                        Google
                    </button>
                </div>

                <div class="footer-links">
                    ¿No tienes una cuenta? <a href="signup.html">Regístrate gratis</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './assets/js/firebase-init.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Keep some localStorage for quick UI checks but rely on Firebase for truth
                localStorage.setItem('userLogedIn', 'true');
                localStorage.setItem('userEmail', user.email);

                showToast('¡Bienvenido cho!');
                window.location.href = './';
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                let message = "Error al iniciar sesión. Por favor, verifica tus datos.";
                if (error.code === 'auth/invalid-credential') message = "Correo o contraseña incorrectos.";
                if (error.code === 'auth/user-not-found') message = "Usuario no encontrado.";
                showToast(message, 'error');
            }
        });
    </script>

        <script src="assets/js/pwa-init.js"></script>
</body>

</html>
