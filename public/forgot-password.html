<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Restablecer Contraseña | CityMart</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/utils.js"></script>
    <style>
        .reset-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .reset-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(11, 89, 242, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0947c9;
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <header class="section" style="padding-top: 20px;">
        <div class="container" style="display: flex; justify-content: center;">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="CityMart" style="height: 60px; width: auto;">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="reset-container">
            <div class="reset-card">
                <h2 style="font-family: 'Inter'; font-size: 1.8rem; margin-bottom: 8px;">Restablecer contraseña</h2>
                <p style="color: #6b7280; margin-bottom: 30px; font-size: 0.95rem;">Ingresa tu correo electrónico para enviarte las instrucciones de recuperación.
                </p>

                <form id="reset-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="submit-btn">ENVIAR INSTRUCCIONES</button>
                </form>

                <div class="footer-links">
                    <a href="login.html">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './assets/js/firebase-init.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submit-btn');
            
            btn.disabled = true;
            btn.innerText = "ENVIANDO...";

            try {
                await sendPasswordResetEmail(auth, email);
                showToast('Se ha enviado un correo con instrucciones para restablecer tu contraseña.');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } catch (error) {
                console.error("Error al enviar correo de restablecimiento:", error);
                let message = "Hubo un error al procesar tu solicitud.";
                if (error.code === 'auth/user-not-found') message = "No existe una cuenta asociada a este correo.";
                if (error.code === 'auth/invalid-email') message = "El formato del correo es inválido.";
                showToast(message, 'error');
                btn.disabled = false;
                btn.innerText = "ENVIAR INSTRUCCIONES";
            }
        });
    </script>
</body>

</html>
