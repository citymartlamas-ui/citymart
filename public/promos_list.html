<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Todas las promociones | CityMart</title>
    <meta name="description" content="Listado completo de promociones activas en CityMart.">
    <link rel="canonical" href="https://citymart.vip/promos_list">
    <link rel="icon" type="image/png" href="assets/icons/app-icon-192-v4.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-v4.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="assets/style.css?v=20260411-premium-fix-1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="assets/js/utils.js?v=20260424-list-fix-1"></script>
    <script defer src="assets/js/cache.js?v=20260424-list-fix-1"></script>
    <style>
        body { background: #f8fafc; color: #0f172a; padding-bottom: 110px; }
        .list-shell { width: min(760px, calc(100% - 24px)); margin: 0 auto; padding: 14px 0 28px; }
        .list-topbar { position: sticky; top: 0; z-index: 20; margin: 0 -12px 12px; padding: 12px; background: rgba(248,250,252,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .list-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
        .back-link { width:42px; height:42px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; background:#fff; color:#0f172a; text-decoration:none; box-shadow:0 12px 24px -20px rgba(15,23,42,.6); }
        .list-title { margin:0; font-family:Inter,sans-serif; font-size:1.35rem; line-height:1.05; }
        .list-subtitle { margin:4px 0 0; color:#64748b; font-size:.82rem; font-weight:700; }
        .city-chip { flex-shrink:0; border-radius:999px; padding:8px 12px; background:#fef3c7; color:#92400e; font-size:.72rem; font-weight:900; text-transform:uppercase; }
        .list-stack { display:flex; flex-direction:column; gap:12px; }
        .promo-card { min-height:156px; border-radius:22px; overflow:hidden; position:relative; background:#111827; border:1px solid #e2e8f0; box-shadow:0 14px 28px -24px rgba(15,23,42,.5); cursor:pointer; }
        .promo-card img, .promo-card video { width:100%; height:178px; display:block; object-fit:cover; background:#e2e8f0; }
        .promo-veil { position:absolute; inset:0; display:flex; align-items:flex-end; padding:16px; background:linear-gradient(to top, rgba(15,23,42,.92), rgba(15,23,42,.25) 58%, transparent); }
        .promo-card h2 { margin:0; color:#fff; font-family:Inter,sans-serif; font-size:1.1rem; line-height:1.2; }
        .promo-card p { margin:6px 0 0; color:rgba(255,255,255,.78); font-size:.82rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .price-pill { flex-shrink:0; padding:8px 12px; border-radius:12px; background:#fbbf24; color:#111827; font-weight:900; }
        .state-box { padding:44px 18px; border-radius:22px; background:#fff; border:1px dashed #cbd5e1; text-align:center; color:#64748b; font-weight:700; }
    </style>
</head>
<body>
    <main class="list-shell">
        <header class="list-topbar">
            <div class="list-head">
                <a class="back-link" href="./" aria-label="Volver al inicio"><i data-lucide="chevron-left"></i></a>
                <div style="flex:1; min-width:0;">
                    <h1 class="list-title">Promociones</h1>
                    <p id="city-subtitle" class="list-subtitle">Ofertas activas</p>
                </div>
                <span id="city-chip" class="city-chip">Lamas</span>
            </div>
        </header>
        <section id="promos-list" class="list-stack" aria-live="polite">
            <div class="state-box">Cargando promociones...</div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="./" class="nav-item"><i data-lucide="home" class="nav-icon"></i><span>Inicio</span></a>
        <a href="turismo.html" class="nav-item"><i data-lucide="compass" class="nav-icon"></i><span>Turismo</span></a>
        <a href="profile.html" class="nav-item" style="position: relative; z-index: 10;"><div style="background:linear-gradient(135deg,#fbbf24,#f59e0b);width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-35px;border:4px solid white;box-shadow:0 4px 15px rgba(245,158,11,.4);"><i data-lucide="plus" style="width:32px;height:32px;color:white;"></i></div><span style="font-weight:700;color:#1f2937;margin-top:2px;">Publicar</span></a>
        <a href="community.html" class="nav-item"><i data-lucide="users" class="nav-icon"></i><span>Comunidad</span></a>
        <a href="profile.html" class="nav-item"><i data-lucide="user-circle" class="nav-icon"></i><span>Perfil</span></a>
    </nav>

    <script type="module">
        import { db } from './assets/js/firebase-init.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const currentCity = window.getStoredCity ? window.getStoredCity() : 'lamas';
        const cityLabel = currentCity.charAt(0).toUpperCase() + currentCity.slice(1);
        const list = document.getElementById('promos-list');
        document.getElementById('city-subtitle').textContent = `Ofertas en ${cityLabel}`;
        document.getElementById('city-chip').textContent = cityLabel;

        function cityOf(item) {
            const raw = item.ciudad || item.provincia || item.ubicacion || 'lamas';
            return window.normalizeCityValue ? window.normalizeCityValue(raw) : String(raw).toLowerCase().trim();
        }

        function getTimestamp(item) {
            const raw = item.fecha_creacion || item.createdAt || item.timestamp || 0;
            if (typeof raw?.toDate === 'function') return raw.toDate().getTime();
            if (typeof raw?.seconds === 'number') return raw.seconds * 1000;
            if (typeof raw === 'number') return raw;
            const parsed = new Date(raw).getTime();
            return Number.isNaN(parsed) ? 0 : parsed;
        }

        function render(items) {
            const escape = window.escapeHtml || ((value) => String(value ?? ''));
            const filtered = (items || [])
                .filter((item) => cityOf(item) === currentCity)
                .sort((a, b) => getTimestamp(b) - getTimestamp(a));

            if (!filtered.length) {
                list.innerHTML = `<div class="state-box">No hay promociones activas en ${escape(cityLabel)} por ahora.</div>`;
                return;
            }

            list.innerHTML = filtered.map((promo) => {
                const imageRaw = window.pickDisplayImage
                    ? window.pickDisplayImage([promo.imagen_thumb, promo.imagen], 'assets/placeholder.svg', { width: 760 })
                    : (promo.imagen_thumb || promo.imagen || 'assets/placeholder.svg');
                const image = window.sanitizeUrl ? window.sanitizeUrl(imageRaw, 'assets/placeholder.svg') : imageRaw;
                const isVideo = promo.imagen && (String(promo.imagen).includes('.mp4') || promo.tipo === 'video');
                const media = isVideo
                    ? `<video src="${escape(window.sanitizeUrl ? window.sanitizeUrl(promo.imagen, '') : promo.imagen)}" autoplay loop muted playsinline preload="metadata"></video>`
                    : `<img src="${escape(image)}" alt="${escape(promo.titulo || 'Promocion')}" loading="lazy" decoding="async">`;
                const price = promo.precio_oferta ? String(promo.precio_oferta).replace(/^S\/\s*/i, '') : '';
                return `
                    <article class="promo-card" onclick="window.location.href='promo_detail.html?id=${encodeURIComponent(promo.id)}'">
                        ${media}
                        <div class="promo-veil">
                            <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px; width:100%;">
                                <div style="min-width:0;">
                                    <h2>${escape(promo.titulo || 'Promocion sin titulo')}</h2>
                                    <p>${escape(promo.descripcion || promo.resumen || 'Toca para ver los detalles de esta promocion.')}</p>
                                </div>
                                ${price ? `<span class="price-pill">S/ ${escape(price)}</span>` : ''}
                            </div>
                        </div>
                    </article>`;
            }).join('');
            if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        async function loadPromos() {
            try {
                await window.CityCache.loadWithCache('promociones',
                    async () => {
                        const snap = await getDocs(collection(db, 'promociones'));
                        return snap.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
                    },
                    render
                );
            } catch (error) {
                console.error('Error loading promos:', error);
                list.innerHTML = '<div class="state-box">No se pudieron cargar las promociones. Intenta nuevamente.</div>';
            }
        }

        if (window.lucide?.createIcons) window.lucide.createIcons();
        loadPromos();
    </script>
    <script src="assets/js/pwa-init.js?v=20260424-list-fix-1"></script>
</body>
</html>
