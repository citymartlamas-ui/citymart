<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crear Cuenta | CityMart</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/utils.js"></script>
    <style>
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        .signup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 120px);
            padding: 24px;
        }

        .signup-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.02);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-soft);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-soft);
            width: 18px;
            transition: var(--transition);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 14px 14px 48px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(0,0,0,0.08);
            background: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            color: var(--text-main);
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        input:focus + i {
            color: var(--primary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.2);
            letter-spacing: 0.02em;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .footer-links {
            margin-top: 32px;
            font-size: 0.95rem;
            color: var(--text-soft);
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 24px 0;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#065f46">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-v4.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <header class="section" style="padding-top: 20px;">
        <div class="container" style="display: flex; justify-content: center;">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="CityMart" style="height: 60px; width: auto;">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="signup-container">
            <div class="signup-card">
                <h2 style="font-family: 'Inter'; font-size: 1.8rem; margin-bottom: 8px; color: var(--text-main); font-weight: 700;">Únete a la comunidad</h2>
                <p style="color: var(--text-soft); margin-bottom: 32px; font-size: 0.95rem; font-weight: 500;">Crea tu cuenta de usuario hoy mismo</p>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" id="name" placeholder="Juan Pérez" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8"
                                required>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="terms-check" required>
                        <label for="terms-check" style="font-weight: 600; font-size: 0.85rem; color: var(--text-soft); text-transform: none; letter-spacing: normal; margin-bottom: 0;">
                            Acepto los <a href="#" style="color: var(--primary-color); font-weight: 700;">Términos y Condiciones</a> y la <a href="#" style="color: var(--primary-color); font-weight: 700;">Política de Privacidad</a>.
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">CREAR CUENTA</button>
                </form>

                <div class="footer-links">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './assets/js/firebase-init.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms-check').checked;

            if (!terms) {
                showToast('Debes aceptar los términos y condiciones.', 'error');
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Guardar el nombre en el perfil del usuario de Firebase
                await updateProfile(user, { displayName: name });

                localStorage.setItem('userLogedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', name);

                showToast('¡Cuenta creada con éxito! Bienvenido cho');
                window.location.href = './';
            } catch (error) {
                console.error("Error al crear cuenta:", error);
                let message = "Hubo un error al crear la cuenta.";
                if (error.code === 'auth/email-already-in-use') message = "Este correo ya está registrado.";
                if (error.code === 'auth/weak-password') message = "La contraseña es muy débil.";
                showToast(message, 'error');
            }
        });
    </script>

        <script src="assets/js/pwa-init.js"></script>
</body>

</html>
