<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .signup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(11, 89, 242, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0947c9;
            transform: translateY(-2px);
        }

        .terms {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #6b7280;
            line-height: 1.4;
        }

        .footer-links {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <header class="section" style="padding-top: 20px;">
        <div class="container" style="display: flex; justify-content: center;">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 80px; width: auto;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.8rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="signup-container">
            <div class="signup-card">
                <h2 style="font-family: 'Outfit'; font-size: 1.8rem; margin-bottom: 8px;">Únete a la comunidad</h2>
                <p style="color: #6b7280; margin-bottom: 25px; font-size: 0.95rem;">Crea tu cuenta de usuario hoy mismo
                </p>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="name">Nombre Completo</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" id="name" placeholder="Juan Pérez" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8"
                                required>
                        </div>
                    </div>

                    <div class="form-group"
                        style="display: flex; align-items: flex-start; gap: 10px; margin-top: 15px;">
                        <input type="checkbox" id="terms-check" style="width: auto; margin-top: 4px;" required>
                        <label for="terms-check" style="font-weight: 400; font-size: 0.8rem; color: #6b7280;">Acepto los
                            <a href="#" style="color: var(--primary-color); font-weight: 600;">Términos y
                                Condiciones</a> y la <a href="#"
                                style="color: var(--primary-color); font-weight: 600;">Política de
                                Privacidad</a>.</label>
                    </div>

                    <button type="submit" class="btn-primary">CREAR CUENTA</button>
                </form>

                <div class="footer-links">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './assets/js/firebase-init.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms-check').checked;

            if (!terms) {
                alert('Debes aceptar los términos y condiciones.');
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Guardar el nombre en el perfil del usuario de Firebase
                await updateProfile(user, { displayName: name });

                localStorage.setItem('userLogedIn', 'true');
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', name);

                alert('¡Cuenta creada con éxito!');
                window.location.href = './';
            } catch (error) {
                console.error("Error al crear cuenta:", error);
                let message = "Hubo un error al crear la cuenta.";
                if (error.code === 'auth/email-already-in-use') message = "Este correo ya está registrado.";
                if (error.code === 'auth/weak-password') message = "La contraseña es muy débil.";
                alert(message);
            }
        });
    </script>
</body>

</html>
