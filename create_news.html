<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Noticia | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--jungle-green);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fdfdfd;
            font-size: 1rem;
            outline: none;
        }

        .upload-area {
            width: 100%;
            height: 180px;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <header class="section" style="padding-top: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
        <div class="container">
            <div style="display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 60px; width: auto; margin-left: -10px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.3rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="profile.html" style="color: var(--text-color);"><i data-lucide="chevron-left"
                        style="width: 28px; height: 28px;"></i></a>
                <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.3rem;">Crear Noticia</h2>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 20px; padding-bottom: 100px;">
        <form id="news-form">
            <div class="form-group">
                <label>Imagen de Portada</label>
                <div class="upload-area" style="position: relative; overflow: hidden; cursor: pointer;">
                    <div id="default-upload-content"
                        style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none;">
                        <i data-lucide="camera" style="width: 40px; height: 40px; margin-bottom: 8px;"></i>
                        <p style="font-weight: 600; font-size: 0.9rem;">Toca para subir foto</p>
                        <p style="font-size: 0.7rem;">Imagen horizontal recomendada</p>
                    </div>
                    <img id="image-preview"
                        style="display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; pointer-events: none;" />
                    <input type="file" id="news-image" accept="image/*"
                        style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="title">Título de la Noticia</label>
                <input type="text" id="title" placeholder="Ej. Gran inauguración de la feria artesanal" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" required>
                    <option value="eventos">Eventos</option>
                    <option value="comunidad">Comunidad</option>
                    <option value="turismo">Turismo</option>
                    <option value="negocios">Negocios</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">Contenido</label>
                <textarea id="content" rows="8" placeholder="Escribe el desarrollo de la noticia aquí..."
                    required></textarea>
            </div>

            <button type="submit" id="submit-btn"
                style="width: 100%; padding: 16px; background: var(--jungle-green); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; margin-top: 20px; transition: background 0.2s; cursor: pointer;">PUBLICAR
                NOTICIA</button>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="./" class="nav-item">
            <i data-lucide="home" class="nav-icon"></i>
            <span>Inicio</span>
        </a>
        <a href="directory.html" class="nav-item">
            <i data-lucide="layout-grid" class="nav-icon"></i>
            <span>Directorio</span>
        </a>
        <a href="news.html" class="nav-item">
            <i data-lucide="flame" class="nav-icon"></i>
            <span>Noticias</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i data-lucide="user-circle" class="nav-icon"></i>
            <span>Perfil</span>
        </a>
    </nav>

    <script type="module">
        import { db, storage } from './assets/js/firebase-init.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        lucide.createIcons();

        // Image Preview Logic
        const fileInput = document.getElementById('news-image');
        const previewEl = document.getElementById('image-preview');
        const defaultContent = document.getElementById('default-upload-content');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewEl.src = e.target.result;
                    previewEl.style.display = 'block';
                    defaultContent.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                previewEl.src = '';
                previewEl.style.display = 'none';
                defaultContent.style.display = 'flex';
            }
        });

        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader-small" style="display:inline-block; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite;"></div> Publicando...';

            try {
                const title = document.getElementById('title').value;
                const category = document.getElementById('category').value;
                const content = document.getElementById('content').value;

                let imageUrl = "";

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const sanitizeName = file.name.replace(/[^a-zA-Z0-9.]/g, '');
                    const filePath = `noticias/${Date.now()}_${sanitizeName}`;
                    const storageRef = ref(storage, filePath);
                    
                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                }

                await addDoc(collection(db, "noticias"), {
                    titulo: title,
                    categoria: category,
                    contenido: content,
                    imagen: imageUrl,
                    estado: 'pendiente',
                    fecha_creacion: serverTimestamp()
                });

                alert('¡Noticia enviada para revisión! Aparecerá en la sección de noticias pronto.');
                window.location.href = 'profile.html';
                
            } catch (error) {
                console.error("Error al publicar la noticia:", error);
                alert("Hubo un error al publicar la noticia. Por favor intenta nuevamente.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'PUBLICAR NOTICIA';
            }
        });
    </script>
</body>

</html>
