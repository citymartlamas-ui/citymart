<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Noticia | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--jungle-green);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fdfdfd;
            font-size: 1rem;
            outline: none;
        }

        .upload-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            height: auto;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            margin-bottom: 10px;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3594/3594363.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <header class="section" style="padding-top: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
        <div class="container">
            <div style="display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 60px; width: auto; margin-left: -10px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.3rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="profile.html" style="color: var(--text-color);"><i data-lucide="chevron-left"
                        style="width: 28px; height: 28px;"></i></a>
                <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.3rem;">Crear Noticia</h2>
            </div>
        </div>
    </header>

    <!-- MODAL DE ÉXITO -->
    <div id="success-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px);">
        <div
            style="background: white; border-radius: 24px; padding: 30px; width: 100%; max-width: 400px; text-align: center; position: relative; animation: slideUp 0.3s ease-out;">
            <div
                style="width: 80px; height: 80px; background: #ecfdf5; color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i data-lucide="check-circle" style="width: 40px; height: 40px;"></i>
            </div>
            <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.5rem; margin-bottom: 15px; color: #111;">
                ¡Recibido!</h2>
            <p style="color: #666; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;">Tu noticia ha sido
                enviada. Realiza el pago vía <b>Yape</b> al <b>928 403 248</b> y envíanos el comprobante por WhatsApp
                para su revisión.</p>

            <a id="whatsapp-admin-link" href="#" target="_blank"
                style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #25d366; color: white; padding: 16px; border-radius: 12px; font-weight: 800; text-decoration: none; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);">
                <i data-lucide="message-circle"></i> CONTACTAR ADMIN
            </a>

            <button onclick="window.location.href='profile.html'"
                style="background: transparent; border: none; color: #9ca3af; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;">Volver
                al perfil</button>
        </div>
    </div>

    <style>
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>

    <main class="container" style="padding-top: 20px; padding-bottom: 100px;">
        <form id="news-form">
            <div class="form-group">
                <label>Imagen de Portada</label>
                <div class="upload-area" style="position: relative; overflow: hidden; cursor: pointer;">
                    <div id="default-upload-content"
                        style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none;">
                        <i data-lucide="camera" style="width: 40px; height: 40px; margin-bottom: 8px;"></i>
                        <p style="font-weight: 600; font-size: 0.9rem;">Toca para subir foto</p>
                        <p style="font-size: 0.7rem;">Imagen cuadrada 1:1 recomendada</p>
                    </div>
                    <img id="image-preview"
                        style="display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; pointer-events: none;" />
                    <input type="file" id="news-image" accept="image/*"
                        style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="title">Título de la Noticia</label>
                <input type="text" id="title" placeholder="Ej. Gran inauguración de la feria artesanal" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" required>
                    <option value="eventos">Eventos</option>
                    <option value="comunidad">Comunidad</option>
                    <option value="turismo">Turismo</option>
                    <option value="negocios">Negocios</option>
                    <option value="deportes">Deportes</option>
                    <option value="pro_salud">Pro Salud</option>
                    <option value="gobierno">Gobierno</option>
                    <option value="entretenimiento">Entretenimiento</option>
                    <option value="educacion">Educación</option>
                </select>
            </div>

            <div class="form-group">
                <label for="content">Contenido</label>
                <textarea id="content" rows="8" placeholder="Escribe el desarrollo de la noticia aquí..."
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp de Contacto (Opcional)</label>
                <input type="tel" id="whatsapp" placeholder="Ej. 987654321 - Para que los usuarios te contacten"
                    pattern="[0-9]{9}" title="Ingrese un número de celular de 9 dígitos">
            </div>

            <button type="submit" id="submit-btn"
                style="width: 100%; padding: 16px; background: #111827; color: var(--accent-color); border: none; border-radius: 12px; font-weight: 900; font-size: 1.1rem; margin-top: 10px; transition: background 0.2s; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); letter-spacing: 0.05em;">PUBLICAR
                NOTICIA</button>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="./" class="nav-item">
            <i data-lucide="home" class="nav-icon"></i>
            <span>Inicio</span>
        </a>
        <a href="directory.html" class="nav-item">
            <i data-lucide="layout-grid" class="nav-icon"></i>
            <span>Directorio</span>
        </a>
        <!-- Botón Publicar Central -->
        <a href="profile.html" class="nav-item" style="position: relative; z-index: 10;">
            <div
                style="background: linear-gradient(135deg, #fbbf24, #f59e0b); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);">
                <i data-lucide="plus" style="width: 32px; height: 32px; color: white;"></i>
            </div>
            <span style="font-weight: 800; color: #1f2937; margin-top: 2px;">Publicar</span>
        </a>
        <a href="news.html" class="nav-item">
            <i data-lucide="bell" class="nav-icon"></i>
            <span>Noticias</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i data-lucide="user-circle" class="nav-icon"></i>
            <span>Perfil</span>
        </a>
    </nav>

    <script type="module">
        import { db, storage } from './assets/js/firebase-init.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        lucide.createIcons();

        // Image Preview Logic
        const fileInput = document.getElementById('news-image');
        const previewEl = document.getElementById('image-preview');
        const defaultContent = document.getElementById('default-upload-content');

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewEl.src = e.target.result;
                    previewEl.style.display = 'block';
                    defaultContent.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                previewEl.src = '';
                previewEl.style.display = 'none';
                defaultContent.style.display = 'flex';
            }
        });

        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader-small" style="display:inline-block; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite;"></div> Publicando...';

            try {
                const title = document.getElementById('title').value;
                const category = document.getElementById('category').value;
                const content = document.getElementById('content').value;
                const whatsappRaw = document.getElementById('whatsapp').value.trim();

                // Limpiar número usando expresión regular (solo dejar números)
                const whatsapp = whatsappRaw ? whatsappRaw.replace(/[^0-9]/g, '') : null;

                let imageUrl = "";

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const sanitizeName = file.name.replace(/[^a-zA-Z0-9.]/g, '');
                    const filePath = `noticias/${Date.now()}_${sanitizeName}`;
                    const storageRef = ref(storage, filePath);

                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                }

                await addDoc(collection(db, "noticias"), {
                    titulo: title,
                    categoria: category,
                    contenido: content,
                    imagen: imageUrl,
                    whatsapp: whatsapp,
                    estado: 'pendiente',
                    fecha_creacion: serverTimestamp()
                });

                // Preparar mensaje de WhatsApp para el administrador
                const adminPhone = "51928403248"; // <-- ACTUALIZA ESTE NÚMERO
                const msg = encodeURIComponent(`Hola CityMart Lamas, acabo de enviar la noticia "${title}". Adjunto el comprobante de pago (Yape a 928403248) para su revisión.`);
                document.getElementById('whatsapp-admin-link').href = `https://wa.me/${adminPhone}?text=${msg}`;

                // Mostrar modal de éxito
                document.getElementById('success-modal').style.display = 'flex';
                lucide.createIcons();

            } catch (error) {
                console.error("Error al publicar la noticia:", error);
                alert("Hubo un error al publicar la noticia. Por favor intenta nuevamente.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'PUBLICAR NOTICIA';
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(e => console.error('Error SW', e));
            });
        }
    </script>
</body>

</html>
