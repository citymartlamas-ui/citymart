<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todas las Categorías | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 20px 0;
        }

        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 16px;
            background: #f9fafb;
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .category-card:hover {
            background: #f3f4f6;
            transform: translateY(-4px);
        }

        .cat-icon-large {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: var(--primary-color);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .cat-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-color);
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3594/3594363.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <header class="section" style="padding-top: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
        <div class="container">
            <div style="display: flex; align-items: center; margin-bottom: 12px; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 60px; width: auto; margin-left: -10px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.3rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="directory.html" style="color: var(--text-color);"><i data-lucide="chevron-left"></i></a>
                <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.4rem;">Categorías</h2>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom: 100px;">
        <div class="category-grid" id="all-cats">
            <!-- PWA Style Grid -->
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="./" class="nav-item">
            <i data-lucide="home" class="nav-icon"></i>
            <span>Inicio</span>
        </a>
        <a href="directory.html" class="nav-item active">
            <i data-lucide="layout-grid" class="nav-icon"></i>
            <span>Directorio</span>
        </a>
        <!-- Botón Publicar Central -->
        <a href="profile.html" class="nav-item" style="position: relative; z-index: 10;">
            <div
                style="background: linear-gradient(135deg, #fbbf24, #f59e0b); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);">
                <i data-lucide="plus" style="width: 32px; height: 32px; color: white;"></i>
            </div>
            <span style="font-weight: 800; color: #1f2937; margin-top: 2px;">Publicar</span>
        </a>
        <a href="news.html" class="nav-item">
            <i data-lucide="bell" class="nav-icon"></i>
            <span>Noticias</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i data-lucide="user-circle" class="nav-icon"></i>
            <span>Perfil</span>
        </a>
    </nav>

    <script>
        const categories = [
            // Comida y Bebidas
            { name: "Restaurantes", icon: "utensils", value: "restaurantes", group: "Comida" },
            { name: "Cafeterías", icon: "coffee", value: "cafeteria", group: "Comida" },
            { name: "Bares / Karaokes", icon: "beer", value: "bar", group: "Comida" },
            { name: "Panaderías", icon: "cake", value: "panaderia", group: "Comida" },
            { name: "Comida Rápida", icon: "pizza", value: "comida_rapida", group: "Comida" },
            // Hospedaje
            { name: "Hoteles", icon: "bed", value: "hospedaje", group: "Hoteles" },
            { name: "Alquileres", icon: "home", value: "alquiler", group: "Hoteles" },
            // Arte
            { name: "Artesanías", icon: "shopping-bag", value: "artesania", group: "Artesanías" },
            { name: "Arte y Cultura", icon: "palette", value: "arte_cultura", group: "Artesanías" },
            // Comercio
            { name: "Tiendas", icon: "shopping-cart", value: "tiendas", group: "Comercio" },
            { name: "Moda y Ropa", icon: "shirt", value: "moda", group: "Comercio" },
            { name: "Tecnología", icon: "smartphone", value: "tecnologia", group: "Comercio" },
            { name: "Ferreterías", icon: "hammer", value: "ferreteria", group: "Comercio" },
            { name: "Librerías", icon: "book-open", value: "libreria", group: "Comercio" },
            // Salud
            { name: "Farmacias", icon: "pill", value: "salud", group: "Salud" },
            { name: "Clínicas", icon: "stethoscope", value: "clinica", group: "Salud" },
            { name: "Spa y Bienestar", icon: "heart-pulse", value: "spa", group: "Salud" },
            { name: "Gimnasios", icon: "dumbbell", value: "gimnasio", group: "Salud" },
            // Servicios
            { name: "Servicios Generales", icon: "wrench", value: "servicios", group: "Servicios" },
            { name: "Construcción", icon: "hard-hat", value: "construccion", group: "Servicios" },
            { name: "Carpintería", icon: "axe", value: "carpinteria", group: "Servicios" },
            { name: "Gasfitería", icon: "droplets", value: "gasfiteria", group: "Servicios" },
            { name: "Electricistas", icon: "zap", value: "electricista", group: "Servicios" },
            { name: "Peluquerías", icon: "scissors", value: "peluqueria", group: "Servicios" },
            { name: "Sastrería", icon: "ruler", value: "sastreria", group: "Servicios" },
            { name: "Lavanderías", icon: "waves", value: "lavanderia", group: "Servicios" },
            { name: "Contabilidad", icon: "calculator", value: "contabilidad", group: "Servicios" },
            { name: "Mecánica", icon: "settings", value: "mecanica", group: "Servicios" },
            // Transporte
            { name: "Transporte", icon: "car", value: "transporte", group: "Transporte" },
            { name: "Turismo", icon: "map", value: "turismo", group: "Transporte" },
            // Educación
            { name: "Educación", icon: "graduation-cap", value: "educacion", group: "Educación" },
            // Agro
            { name: "Agricultura", icon: "tree-pine", value: "agro", group: "Agro" },
            { name: "Veterinarias", icon: "dog", value: "veterinaria", group: "Agro" },
        ];

        const grid = document.getElementById('all-cats');

        categories.forEach(cat => {
            grid.innerHTML += `
                <div class="category-card" onclick="window.location.href='directory.html?cat=${encodeURIComponent(cat.value)}'">
                    <div class="cat-icon-large">
                        <i data-lucide="${cat.icon}"></i>
                    </div>
                    <span class="cat-name">${cat.name}</span>
                </div>
            `;
        });

        lucide.createIcons();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(e => console.error('Error SW', e));
            });
        }
    </script>
</body>

</html>
