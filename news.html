<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3594/3594363.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6211692359872996"
        crossorigin="anonymous"></script>
</head>

<body>
    <header class="section" style="padding-top: 16px; padding-bottom: 8px;">
        <div class="container">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 70px; width: auto; margin-left: -12px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.6rem;">Noticias<span
                        style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <p style="color: #666; font-size: 0.9rem; margin-top: 4px;">Entérate de lo último en la ciudad</p>
        </div>
    </header>

    <main style="padding-bottom: 100px;">
        <div style="display: flex; flex-direction: column; gap: 0;">
            <!-- Se poblará dinámicamente con Firebase -->
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="./" class="nav-item">
            <i data-lucide="home" class="nav-icon"></i>
            <span>Inicio</span>
        </a>
        <a href="directory.html" class="nav-item">
            <i data-lucide="layout-grid" class="nav-icon"></i>
            <span>Directorio</span>
        </a>
        <!-- Botón Publicar Central -->
        <a href="profile.html" class="nav-item" style="position: relative; z-index: 10;">
            <div
                style="background: linear-gradient(135deg, #fbbf24, #f59e0b); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);">
                <i data-lucide="plus" style="width: 32px; height: 32px; color: white;"></i>
            </div>
            <span style="font-weight: 800; color: #1f2937; margin-top: 2px;">Publicar</span>
        </a>
        <a href="news.html" class="nav-item active">
            <i data-lucide="bell" class="nav-icon"></i>
            <span>Noticias</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i data-lucide="user-circle" class="nav-icon"></i>
            <span>Perfil</span>
        </a>
    </nav>

    <script type="module">
        import { db } from './assets/js/firebase-init.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        lucide.createIcons();

        const newsContainer = document.querySelector('main > div');

        function loadNews() {
            newsContainer.innerHTML = `<div style="text-align:center; padding: 40px;"><div class="loader"></div><p style="margin-top:10px; color:#666;">Cargando noticias...</p></div>`;

            try {
                onSnapshot(collection(db, "noticias"), (querySnapshot) => {
                    newsContainer.innerHTML = '';

                    if (querySnapshot.empty) {
                        newsContainer.innerHTML = `<p style="text-align:center; padding:40px; color:#666;">No hay noticias recientes.</p>`;
                        return;
                    }

                    const docs = [];
                    querySnapshot.forEach(doc => {
                        const data = doc.data();
                        // Mostrar solo si está explícitamente aprobado o si es una noticia MUY antigua sin estado
                        if (data.estado === 'aprobado' || !data.estado) {
                            docs.push({ id: doc.id, ...data });
                        }
                    });

                    // Ordenar por fecha_creacion descending
                    docs.sort((a, b) => {
                        const dateA = a.fecha_creacion?.seconds || 0;
                        const dateB = b.fecha_creacion?.seconds || 0;
                        return dateB - dateA;
                    });

                    if (docs.length === 0) {
                        newsContainer.innerHTML = `<p style="text-align:center; padding:40px; color:#666;">No hay noticias recientes.</p>`;
                        return;
                    }

                    docs.forEach((data, index) => {
                        const card = document.createElement('div');
                        card.style.position = 'relative';
                        card.style.width = '100%';
                        card.style.height = '400px'; // 400px de alto, compatible universalmente
                        card.style.cursor = 'pointer';
                        card.style.overflow = 'hidden';

                        card.onclick = () => {
                            window.location.href = `news_detail.html?id=${data.id}`;
                        };

                        const tagText = (data.categoria || 'NOTICIA').toUpperCase();
                        const tagColor = data.categoria === 'eventos' ? 'var(--secondary-color)' : 'var(--primary-color)';

                        const summary = data.contenido || data.texto || "";

                        card.innerHTML = `
                            <img src="${data.imagen || 'https://images.unsplash.com/photo-1533903345306-15d1c30952de?auto=format&fit=crop&q=80&w=800'}" style="position: absolute; top:0; left:0; width: 100%; height: 100%; object-fit: cover; display: block;">
                            <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 24px 20px; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); color: white;">
                                <span style="background: ${tagColor}; color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">${tagText}</span>
                                <h3 style="font-size: 1.8rem; margin-top: 14px; font-family: 'Outfit', sans-serif; font-weight: 900; line-height: 1.1;">${data.titulo || 'Sin título'}</h3>
                                <p style="font-size: 0.95rem; opacity: 0.9; margin-top: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${summary}</p>
                            </div>
                        `;
                        newsContainer.appendChild(card);

                        // Inyectar banner cada 3 noticias
                        if ((index + 1) % 3 === 0) {
                            const adCard = document.createElement('div');
                            adCard.style.padding = '20px 16px';
                            adCard.style.background = '#f9fafb';
                            adCard.style.borderBottom = '1px solid #eee';
                            adCard.innerHTML = `
                                <ins class="adsbygoogle"
                                     style="display:block"
                                     data-ad-format="fluid"
                                     data-ad-layout-key="-fb+5w+4e-db+86"
                                     data-ad-client="ca-pub-6211692359872996"
                                     data-ad-slot="news_slot"></ins>
                                <script>
                                     (adsbygoogle = window.adsbygoogle || []).push({});
                                <\/script>
                            `;
                            newsContainer.appendChild(adCard);
                        }
                    });
                    lucide.createIcons();
                });
            } catch (error) {
                console.error("Error iniciando onSnapshot de noticias:", error);
                newsContainer.innerHTML = `<p style="text-align:center; padding:40px; color:#ef4444;">Error al configurar la carga de noticias.</p>`;
            }
        }

        loadNews();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => { });
            });
        }
    </script>
</body>

</html>
