<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Negocio | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--jungle-green);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fdfdfd;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .upload-area {
            width: 100%;
            height: 180px;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
            color: var(--primary-color);
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3594/3594363.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <div id="loading-overlay" class="loader-container">
        <div class="loader"></div>
        <p style="margin-top: 15px; font-weight: 800; color: var(--jungle-green);">Cargando datos del negocio...</p>
    </div>

    <header class="section" style="padding-top: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
        <div class="container">
            <div style="display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 60px; width: auto; margin-left: -10px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.3rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="profile.html" style="color: var(--text-color);"><i data-lucide="chevron-left"
                        style="width: 28px; height: 28px;"></i></a>
                <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.3rem;">Editar Negocio</h2>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 20px; padding-bottom: 100px;">
        <form id="edit-form">
            <!-- Multimedia Principal -->
            <div class="form-group">
                <label>Foto Principal (Cambiar Opcionalmente)</label>
                <div class="upload-area" id="image-upload-container"
                    style="position: relative; overflow: hidden; cursor: pointer;">
                    <img id="image-preview"
                        style="width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; pointer-events: none;" />
                    <div id="upload-overlay"
                        style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; color: white;">
                        <i data-lucide="camera" style="width: 32px; height: 32px;"></i>
                    </div>
                    <input type="file" id="business-image" accept="image/*"
                        style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;">
                </div>
            </div>

            <!-- Datos Generales -->
            <div class="form-group">
                <label for="name">Nombre del Negocio</label>
                <input type="text" id="name" placeholder="Ej. Restaurante La Casona" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" required>
                    <option value="">Selecciona una categoría</option>
                    <optgroup label="🍽️ Comida y Bebidas">
                        <option value="restaurantes">Restaurantes</option>
                        <option value="cafeteria">Cafeterías</option>
                        <option value="bar">Bares y Karaokes</option>
                        <option value="panaderia">Panaderías y Pastelerías</option>
                        <option value="comida_rapida">Comida Rápida / Snacks</option>
                    </optgroup>
                    <optgroup label="🏨 Hospedaje">
                        <option value="hospedaje">Hoteles / Hospedaje</option>
                        <option value="alquiler">Alquileres / Inmobiliaria</option>
                    </optgroup>
                    <optgroup label="🎨 Arte y Cultura">
                        <option value="artesania">Artesanías y Souvenirs</option>
                        <option value="arte_cultura">Arte y Cultura</option>
                    </optgroup>
                    <optgroup label="🛒 Comercio">
                        <option value="tiendas">Tiendas / Bodegas</option>
                        <option value="moda">Moda y Ropa</option>
                        <option value="tecnologia">Tecnología y Celulares</option>
                        <option value="ferreteria">Ferreterías</option>
                        <option value="libreria">Librerías y Papelerías</option>
                    </optgroup>
                    <optgroup label="💆 Salud y Bienestar">
                        <option value="salud">Farmacias y Boticas</option>
                        <option value="clinica">Clínicas y Consultorios</option>
                        <option value="spa">Spa y Bienestar</option>
                        <option value="gimnasio">Gimnasios y Deportes</option>
                    </optgroup>
                    <optgroup label="🔧 Servicios Profesionales">
                        <option value="servicios">Servicios Generales</option>
                        <option value="construccion">Construcción</option>
                        <option value="carpinteria">Carpintería</option>
                        <option value="gasfiteria">Gasfitería / Plomería</option>
                        <option value="electricista">Electricistas</option>
                        <option value="peluqueria">Peluquerías y Barberías</option>
                        <option value="sastreria">Sastrería y Costura</option>
                        <option value="lavanderia">Lavanderías</option>
                        <option value="contabilidad">Contabilidad y Abogados</option>
                        <option value="mecanica">Mecánica Automotriz</option>
                    </optgroup>
                    <optgroup label="🚐 Transporte y Turismo">
                        <option value="transporte">Transporte</option>
                        <option value="turismo">Agencias de Turismo</option>
                    </optgroup>
                    <optgroup label="📚 Educación">
                        <option value="educacion">Academias e Institutos</option>
                    </optgroup>
                    <optgroup label="🌾 Agro y Naturaleza">
                        <option value="agro">Agricultura y Ganadería</option>
                        <option value="veterinaria">Veterinarias</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" rows="3" placeholder="Cuéntanos qué hace especial a tu negocio..."
                    required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="open">Abre a las:</label>
                    <input type="time" id="open" required>
                </div>
                <div class="form-group">
                    <label for="close">Cierra a las:</label>
                    <input type="time" id="close" required>
                </div>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp de Contacto</label>
                <div style="position: relative;">
                    <span
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; color: #666;">+51</span>
                    <input type="tel" id="whatsapp" placeholder="999 999 999" style="padding-left: 50px;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Dirección / Ubicación</label>
                <div style="position: relative;">
                    <i data-lucide="map-pin"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; width: 18px;"></i>
                    <input type="text" id="address" placeholder="Ej. Jr. Comercio 123, Lamas" required>
                </div>
            </div>

            <button type="submit" id="submit-btn"
                style="width: 100%; padding: 16px; background: var(--jungle-green); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; margin-top: 20px; box-shadow: 0 4px 15px rgba(0, 77, 64, 0.2); cursor: pointer; transition: background 0.2s;">GUARDAR
                CAMBIOS</button>
        </form>
    </main>

    <script type="module">
        import { auth, db, storage } from './assets/js/firebase-init.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const bizId = urlParams.get('id');

        if (!bizId) {
            alert("No se especificó un negocio.");
            window.location.href = 'profile.html';
        }

        const editForm = document.getElementById('edit-form');
        const loadingOverlay = document.getElementById('loading-overlay');
        const previewEl = document.getElementById('image-preview');
        const fileInput = document.getElementById('business-image');

        let currentBizData = null;

        // Cargar datos del negocio
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const bizDoc = await getDoc(doc(db, "negocio", bizId));
                if (!bizDoc.exists()) {
                    alert("El negocio no existe.");
                    window.location.href = 'profile.html';
                    return;
                }

                currentBizData = bizDoc.data();

                // Verificar que el usuario es el dueño
                if (currentBizData.uid !== user.uid) {
                    alert("No tienes permiso para editar este negocio.");
                    window.location.href = 'profile.html';
                    return;
                }

                // Poblar formulario
                document.getElementById('name').value = currentBizData.nombre || "";
                document.getElementById('category').value = currentBizData.categoria || "";
                document.getElementById('description').value = currentBizData.descripcion || "";
                document.getElementById('address').value = currentBizData.direccion || "";
                document.getElementById('whatsapp').value = currentBizData.numerodecontacto || currentBizData.telefono || "";

                if (currentBizData.horario) {
                    const times = currentBizData.horario.split(' - ');
                    if (times.length === 2) {
                        document.getElementById('open').value = times[0];
                        document.getElementById('close').value = times[1];
                    }
                }

                if (currentBizData.foto || currentBizData.imagen) {
                    previewEl.src = currentBizData.foto || currentBizData.imagen;
                    previewEl.style.display = 'block';
                }

                loadingOverlay.style.display = 'none';
            } catch (err) {
                console.error("Error cargando negocio:", err);
                alert("Error al cargar los datos.");
                window.location.href = 'profile.html';
            }
        });

        // Preview de imagen al cambiar
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewEl.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Guardar cambios
        editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Guardando...';

            try {
                const name = document.getElementById('name').value;
                const category = document.getElementById('category').value;
                const description = document.getElementById('description').value;
                const openTime = document.getElementById('open').value;
                const closeTime = document.getElementById('close').value;
                const whatsapp = document.getElementById('whatsapp').value;
                const address = document.getElementById('address').value;

                let imageUrl = currentBizData.foto || currentBizData.imagen;

                // Si seleccionó nueva imagen, subirla
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const storageRef = ref(storage, `negocios/${Date.now()}_${file.name}`);
                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                }

                await updateDoc(doc(db, "negocio", bizId), {
                    nombre: name,
                    categoria: category,
                    descripcion: description,
                    horario: `${openTime} - ${closeTime}`,
                    telefono: whatsapp,
                    numerodecontacto: whatsapp,
                    direccion: address,
                    foto: imageUrl,
                    imagen: imageUrl,
                    negocio_o_servicio: category === 'servicios' ? 'servicio' : 'negocio'
                });

                alert("¡Datos actualizados con éxito!");
                window.location.href = 'profile.html';

            } catch (err) {
                console.error("Error guardando cambios:", err);
                alert("Error al guardar los cambios.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'GUARDAR CAMBIOS';
            }
        });
    </script>

    <nav class="bottom-nav">
        <a href="./" class="nav-item">
            <i data-lucide="home" class="nav-icon"></i>
            <span>Inicio</span>
        </a>
        <a href="directory.html" class="nav-item">
            <i data-lucide="layout-grid" class="nav-icon"></i>
            <span>Directorio</span>
        </a>
        <a href="profile.html" class="nav-item" style="position: relative; z-index: 10;">
            <div
                style="background: linear-gradient(135deg, #fbbf24, #f59e0b); width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -35px; border: 4px solid white; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);">
                <i data-lucide="plus" style="width: 32px; height: 32px; color: white;"></i>
            </div>
            <span style="font-weight: 800; color: #1f2937; margin-top: 2px;">Publicar</span>
        </a>
        <a href="news.html" class="nav-item">
            <i data-lucide="bell" class="nav-icon"></i>
            <span>Noticias</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i data-lucide="user-circle" class="nav-icon"></i>
            <span>Perfil</span>
        </a>
    </nav>
</body>

</html>
