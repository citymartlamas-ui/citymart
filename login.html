<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            width: 18px;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 44px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 4px rgba(11, 89, 242, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: #0947c9;
            transform: translateY(-2px);
        }

        .social-login {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f3f4f6;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
        }

        .social-btn:hover {
            background: #f9fafb;
        }

        .footer-links {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3594/3594363.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>

<body>
    <header class="section" style="padding-top: 20px;">
        <div class="container" style="display: flex; justify-content: center;">
            <div style="display: flex; align-items: center; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 80px; width: auto;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.8rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="login-container">
            <div class="login-card">
                <h2 style="font-family: 'Outfit'; font-size: 1.8rem; margin-bottom: 8px;">¡Bienvenido de nuevo!</h2>
                <p style="color: #6b7280; margin-bottom: 30px; font-size: 0.95rem;">Ingresa a tu cuenta para continuar
                </p>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail"></i>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                        <div style="text-align: right; margin-top: 8px;">
                            <a href="#"
                                style="font-size: 0.8rem; color: var(--primary-color); text-decoration: none; font-weight: 600;">¿Olvidaste
                                tu contraseña?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">INICIAR SESIÓN</button>
                </form>

                <div class="social-login">
                    <p
                        style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 16px; background: white; display: inline-block; padding: 0 10px; position: relative; top: -10px; z-index: 1;">
                        O continúa con</p>
                    <button class="social-btn">
                        <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 18px;">
                        Google
                    </button>
                </div>

                <div class="footer-links">
                    ¿No tienes una cuenta? <a href="signup.html">Regístrate gratis</a>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './assets/js/firebase-init.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Keep some localStorage for quick UI checks but rely on Firebase for truth
                localStorage.setItem('userLogedIn', 'true');
                localStorage.setItem('userEmail', user.email);
                
                alert('¡Bienvenido a CityMart Lamas!');
                window.location.href = './';
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                let message = "Error al iniciar sesión. Por favor, verifica tus datos.";
                if (error.code === 'auth/invalid-credential') message = "Correo o contraseña incorrectos.";
                if (error.code === 'auth/user-not-found') message = "Usuario no encontrado.";
                alert(message);
            }
        });
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(e => console.error('Error SW', e));
            });
        }
    </script>
</body>

</html>
