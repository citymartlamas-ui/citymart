<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Negocio | CityMart Lamas</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--jungle-green);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.05em;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #eee;
            background: #fdfdfd;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .upload-area {
            width: 100%;
            height: 180px;
            border: 2px dashed #e5e7eb;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
            color: var(--primary-color);
        }
    </style>
</head>

<body>
    <header class="section" style="padding-top: 16px; padding-bottom: 8px; border-bottom: 1px solid #eee;">
        <div class="container">
            <div style="display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; gap: 8px;"
                onclick="window.location.href='./'">
                <img src="assets/logo.png" alt="Logo CityMart" style="height: 60px; width: auto; margin-left: -10px;">
                <h1 style="font-family: 'Outfit'; font-weight: 900; color: #111; font-size: 1.3rem; line-height: 1;">
                    CityMart<span style="color: var(--secondary-color);">Lamas</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <a href="profile.html" style="color: var(--text-color);"><i data-lucide="chevron-left"
                        style="width: 28px; height: 28px;"></i></a>
                <h2 style="font-family: 'Outfit'; font-weight: 900; font-size: 1.3rem;">Registrar Negocio</h2>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 20px; padding-bottom: 100px;">
        <form id="register-form">
            <!-- Multimedia -->
            <div class="form-group">
                <label>Foto Principal del Negocio</label>
                <div class="upload-area" id="image-upload-container"
                    style="position: relative; overflow: hidden; cursor: pointer;">
                    <div id="default-upload-content"
                        style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none;">
                        <i data-lucide="camera" style="width: 40px; height: 40px; margin-bottom: 8px;"></i>
                        <p style="font-weight: 600; font-size: 0.9rem;">Toca para subir una foto</p>
                        <p style="font-size: 0.7rem;">Imagen horizontal recomendada</p>
                    </div>
                    <img id="image-preview"
                        style="display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; pointer-events: none;" />
                    <input type="file" id="business-image" accept="image/*"
                        style="opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer;">
                </div>
            </div>

            <!-- Datos Generales -->
            <div class="form-group">
                <label for="name">Nombre del Negocio</label>
                <input type="text" id="name" placeholder="Ej. Restaurante La Casona" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" required>
                    <option value="">Selecciona una categoría</option>
                    <option value="restaurantes">Comida / Restaurantes</option>
                    <option value="hospedaje">Hoteles / Hospedaje</option>
                    <option value="servicios">Servicios Generales</option>
                    <option value="artesania">Artesanías y Souvenirs</option>
                    <option value="tiendas">Tiendas / Bodegas</option>
                    <option value="salud">Salud y Bienestar</option>
                    <option value="transporte">Transporte y Turismo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" rows="3" placeholder="Cuéntanos qué hace especial a tu negocio..."
                    required></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="open">Abre a las:</label>
                    <input type="time" id="open" required>
                </div>
                <div class="form-group">
                    <label for="close">Cierra a las:</label>
                    <input type="time" id="close" required>
                </div>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp de Contacto</label>
                <div style="position: relative;">
                    <span
                        style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-weight: 700; color: #666;">+51</span>
                    <input type="tel" id="whatsapp" placeholder="999 999 999" style="padding-left: 50px;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Dirección / Ubicación</label>
                <div style="position: relative;">
                    <i data-lucide="map-pin"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; width: 18px;"></i>
                    <input type="text" id="address" placeholder="Ej. Jr. Comercio 123, Lamas" required>
                </div>
            </div>

            <button type="submit" id="submit-btn"
                style="width: 100%; padding: 16px; background: var(--jungle-green); color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; margin-top: 20px; box-shadow: 0 4px 15px rgba(0, 77, 64, 0.2); cursor: pointer; transition: background 0.2s;">ENVIAR
                SOLICITUD</button>
        </form>
    </main>

    <script type="module">
        import { auth, db, storage } from './assets/js/firebase-init.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        lucide.createIcons();

        let currentUser = null;
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                alert("Debes iniciar sesión para registrar un negocio.");
                window.location.href = 'login.html';
            }
        });

        const inputContainer = document.getElementById('image-upload-container');
        const fileInput = document.getElementById('business-image');
        const previewEl = document.getElementById('image-preview');
        const defaultContent = document.getElementById('default-upload-content');

        // Previsualizar la imagen seleccionada
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewEl.src = e.target.result;
                    previewEl.style.display = 'block';
                    defaultContent.style.display = 'none';
                };
                reader.readAsDataURL(file);
            } else {
                previewEl.src = '';
                previewEl.style.display = 'none';
                defaultContent.style.display = 'flex';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUser) {
                alert("Debes iniciar sesión primero.");
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader-small" style="display:inline-block; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite;"></div> Enviando...';

            try {
                const name = document.getElementById('name').value;
                const category = document.getElementById('category').value;
                const description = document.getElementById('description').value;
                const openTime = document.getElementById('open').value;
                const closeTime = document.getElementById('close').value;
                const whatsapp = document.getElementById('whatsapp').value;
                const address = document.getElementById('address').value;

                let imageUrl = "";

                // Subir imagen si existe
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const sanitizeName = file.name.replace(/[^a-zA-Z0-9.]/g, '');
                    const filePath = `negocios/${Date.now()}_${sanitizeName}`;
                    const storageRef = ref(storage, filePath);

                    await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(storageRef);
                }

                // Guardar en Firestore
                await addDoc(collection(db, "negocio"), {
                    nombre: name,
                    categoria: category,
                    descripcion: description,
                    horario: `${openTime} - ${closeTime}`,
                    telefono: whatsapp,
                    numerodecontacto: whatsapp,
                    direccion: address,
                    foto: imageUrl,
                    imagen: imageUrl,
                    negocio_o_servicio: category === 'servicios' ? 'servicio' : 'negocio',
                    estado: 'pendiente',
                    negociovisible: false,
                    uid: currentUser.uid, // VINCULACIÓN CRÍTICA
                    email_propietario: currentUser.email,
                    fecha_registro: serverTimestamp()
                });

                alert('¡Solicitud enviada con éxito! Activaremos tu negocio pronto.');
                window.location.href = 'profile.html';

            } catch (error) {
                console.error("Error al registrar:", error);
                alert("Hubo un error al enviar la solicitud.");
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'ENVIAR SOLICITUD';
            }
        });

        // Limpieza agresiva de caché y Service Worker en móvil
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
                for (const reg of regs) reg.unregister();
            });
            if ('caches' in window) {
                caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
            }
        }
    </script>
</body>

</html>
